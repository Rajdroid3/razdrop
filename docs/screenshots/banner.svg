<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="640" height="360">
    <!-- Deep Navy Background -->
    <rect width="320" height="180" fill="#0A0F1D"/>
    <!-- Sleek Diagonal Cyber Glow Stripe -->
    <path fill="#152138" d="M 0,180 L 180,0 L 220,0 L 40,180 Z" />
    <!-- Cyan Accent Line -->
    <rect y="176" width="320" height="4" fill="#00F2FE"/>

    <!-- Centered Logo Left Group -->
    <g transform="translate(15, 20) scale(0.9)">
        <!-- Outer Wave -->
        <path stroke="#00F2FE" stroke-opacity="0.2" stroke-width="3.5" stroke-linecap="round" fill="none" d="M 96,38 A 42,42 0 0,1 96,90" />
        <path stroke="#00F2FE" stroke-opacity="0.2" stroke-width="3.5" stroke-linecap="round" fill="none" d="M 32,38 A 42,42 0 0,0 32,90" />
        <!-- Logo R Stem -->
        <path fill="#00F2FE" d="M 46,30 L 56,30 L 56,98 L 46,98 Z" />
        <!-- Logo R Loop -->
        <path fill="#00C3FF" d="M 56,30 L 76,30 C 85,30 92,37 92,46 C 92,55 85,62 76,62 L 56,62 Z M 56,40 L 56,52 L 74,52 C 77.5,52 80.5,49 80.5,46 C 80.5,43 77.5,40 74,40 Z" />
        <!-- Logo Lightning Arrow Leg -->
        <path fill="#4FACFE" d="M 66,58 L 78,58 L 92,80 L 80,80 L 88,98 L 64,74 L 76,74 Z" />
    </g>

    <!-- Stylized Text Elements: R A Z D R O P -->
    <!-- Letter R -->
    <path fill="#FFFFFF" d="M 130,68 H 144 C 151,68 155,72 155,78 C 155,84 151,88 144,88 H 137 V 104 H 130 Z M 137,74 V 82 H 143 C 146,82 148,80 148,78 C 148,76 146,74 143,74 Z" />
    <path fill="#00F2FE" d="M 142,88 L 154,104 H 146 L 136,88 Z" />

    <!-- Letter A -->
    <path fill="#FFFFFF" d="M 163,68 H 171 L 180,104 H 173 L 171,96 H 163 L 161,104 H 154 Z M 165,89 H 169 L 167,78 Z" />

    <!-- Letter Z -->
    <path fill="#00F2FE" d="M 185,68 H 201 V 74 L 191,98 H 201 V 104 H 185 V 98 L 195,74 H 185 Z" />

    <!-- Letter D -->
    <path fill="#FFFFFF" d="M 210,68 H 222 C 230,68 235,74 235,86 C 235,98 230,104 222,104 H 210 Z M 217,74 V 98 H 222 C 227,98 228,93 228,86 C 228,79 227,74 222,74 Z" />

    <!-- Letter R -->
    <path fill="#FFFFFF" d="M 242,68 H 255 C 261,68 265,72 265,78 C 265,84 261,88 255,88 H 249 V 104 H 242 Z M 249,74 V 82 H 254 C 257,82 258,80 258,78 C 258,76 257,74 254,74 Z" />
    <path fill="#00F2FE" d="M 253,88 L 264,104 H 257 L 248,88 Z" />

    <!-- Letter O -->
    <path fill="#FFFFFF" d="M 276,68 C 285,68 291,75 291,86 C 291,97 285,104 276,104 C 267,104 261,97 261,86 C 261,75 267,68 276,68 Z M 276,74 C 271,74 268,79 268,86 C 268,93 271,98 276,98 C 281,98 284,93 284,86 C 284,79 281,74 276,74 Z" />

    <!-- Letter P -->
    <path fill="#00F2FE" d="M 297,68 H 309 C 316,68 319,73 319,80 C 319,87 316,92 309,92 H 304 V 104 H 297 Z M 304,74 V 86 H 308 C 311,86 312,84 312,80 C 312,76 311,74 308,74 Z" />

    <!-- Subtle Tagline Indicator Bar -->
    <rect x="130" y="118" width="150" height="2" fill="#64748B" />
</svg>
